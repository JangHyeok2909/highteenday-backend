<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이력서</title>
<style>
  /* ------------------------------------------------------------------
     인쇄 기준 (2026-09-08 개편)
     - Chrome --print-to-pdf 가 @page 여백과 margin box(쪽번호·머리글)를 그대로 쓴다.
       Chrome 131 이상에서 @bottom-center 가 동작한다. 로컬 Chrome 은 152.
     - 글꼴은 Noto Sans KR(가변)을 먼저 찾고 없으면 맑은 고딕으로 떨어진다.
     - 색은 강조 파랑 하나, 개선 초록 하나, 변경 전 주황 하나만 쓴다. 나머지는 회색 단계.
     - 클래스 이름은 원고(```html-raw)가 그대로 쓰므로 바꾸지 않는다:
       kpi · scope · fig · fig-cap · flow · flow-step · flow-arrow · bar-row · bar-label ·
       bar-track · bar-fill(.after) · bar-val · compare · mini-grid · lead · meta · pagebreak · toc
     ------------------------------------------------------------------ */

  :root {
    --ink: #17212B;
    --ink-2: #3B4753;
    --muted: #6B7683;
    --line: #DCE1E7;
    --line-2: #EDF0F3;
    --bg: #F5F7F9;
    --accent: #1F4FA3;
    --accent-2: #2E6BD6;
    --accent-bg: #EEF3FC;
    --accent-line: #C9D8F3;
    --good: #15803D;
    --good-bg: #E8F5EC;
    --warn: #C2410C;
    --warn-bg: #FDF1E8;
    --code-bg: #F3F5F8;
  }

  @page {
    size: A4;
    margin: 14mm 14mm 16mm 14mm;
    @bottom-center {
      content: counter(page) " / " counter(pages);
      color: #8A94A0;
      font-family: "Noto Sans KR", "Malgun Gothic", "맑은 고딕", sans-serif;
      font-size: 8pt;
    }
    @top-right {
      content: "__DOC_TITLE__";
      color: #A3ACB6;
      font-family: "Noto Sans KR", "Malgun Gothic", "맑은 고딕", sans-serif;
      font-size: 7.5pt;
      letter-spacing: 0.02em;
    }
  }
  @page :first {
    @top-right { content: none; }
  }

  * { box-sizing: border-box; }

  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    margin: 0;
    font-family: "Noto Sans KR", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
    font-size: 9.7pt;
    line-height: 1.55;
    color: var(--ink);
    word-break: keep-all;
    overflow-wrap: break-word;
    font-variant-numeric: tabular-nums;
    text-rendering: optimizeLegibility;
  }

  /* ----------------------------------------------------------- 제목 */

  /* 이름 또는 문서 제목 */
  h1 {
    font-size: 21pt;
    font-weight: 700;
    line-height: 1.22;
    margin: 0 0 1.6mm;
    letter-spacing: -0.025em;
    color: var(--ink);
  }

  /* 대분류 (이력서) · 장 (포트폴리오) */
  h2 {
    font-size: 13pt;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: -0.015em;
    margin: 5.2mm 0 2.4mm;
    padding: 0 0 1.4mm 3.2mm;
    border-left: 3.5px solid var(--accent);
    border-bottom: 1px solid var(--line);
    break-after: avoid;
    page-break-after: avoid;
  }

  /* 회사·프로젝트 (이력서) · 절 (포트폴리오) */
  h3 {
    font-size: 10.6pt;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.01em;
    margin: 4mm 0 1.2mm;
    break-after: avoid;
    page-break-after: avoid;
  }
  h3::before {
    content: "";
    display: inline-block;
    width: 1.8mm;
    height: 1.8mm;
    margin: 0 1.8mm 0.4mm 0;
    background: var(--accent);
    border-radius: 0.5mm;
    vertical-align: middle;
  }

  /* 프로젝트 안의 항목 제목 (이력서) */
  h4 {
    font-size: 10.2pt;
    font-weight: 700;
    margin: 3.6mm 0 1.2mm;
    padding-left: 2.4mm;
    border-left: 3px solid var(--accent);
    color: var(--ink);
    break-after: avoid;
    page-break-after: avoid;
  }

  /* 제목 바로 다음 요소는 제목과 함께 움직인다 */
  h2 + p, h3 + p, h4 + p, h2 + ul, h3 + ul, h4 + ul, h2 + table, h3 + table {
    break-before: avoid;
    page-break-before: avoid;
  }

  /* ----------------------------------------------------------- 본문 */

  p { margin: 0 0 2mm; orphans: 3; widows: 3; }

  ul { margin: 0 0 2.2mm; padding-left: 4.6mm; }
  ul ul { margin: 0.6mm 0 0.6mm; }
  li { margin: 0 0 1mm; padding-left: 0.4mm; break-inside: avoid; page-break-inside: avoid; }
  li::marker { color: var(--accent-2); }

  hr { border: 0; border-top: 1px solid var(--line); margin: 2.4mm 0; }

  blockquote {
    margin: 0 0 2.4mm;
    padding: 1.6mm 0 1.6mm 3.2mm;
    border-left: 3px solid var(--accent-line);
    color: var(--ink-2);
  }

  strong { font-weight: 700; }
  em { font-style: normal; color: var(--ink-2); }

  a { color: var(--accent); text-decoration: none; }

  code {
    font-family: Consolas, "Cascadia Mono", "D2Coding", monospace;
    font-size: 9pt;
    background: var(--code-bg);
    color: #1F2A37;
    padding: 0.1mm 1.3mm;
    border-radius: 2.5px;
  }

  pre {
    background: var(--code-bg);
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 2mm 2.8mm;
    margin: 0 0 2.4mm;
    font-size: 8.7pt;
    line-height: 1.48;
    overflow-wrap: break-word;
    white-space: pre-wrap;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  pre code { background: none; padding: 0; font-size: inherit; color: var(--ink); }

  /* ----------------------------------------------------------- 표 */

  table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.6mm 0 2.8mm;
    font-size: 9pt;
    line-height: 1.42;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  th, td {
    padding: 1.3mm 2.2mm;
    text-align: left;
    vertical-align: top;
    border: 0;
    border-bottom: 1px solid var(--line);
  }
  th {
    background: var(--accent-bg);
    color: var(--ink);
    font-weight: 700;
    border-bottom: 1.5px solid var(--accent-line);
    white-space: nowrap;
  }
  tbody tr:last-child td { border-bottom: 1.5px solid var(--line); }
  tbody tr:nth-child(even) td { background: #FAFBFC; }
  th.r, td.r { text-align: right; }
  th.c, td.c { text-align: center; }

  /* 아직 안 채운 자리. 초안에서 눈에 띄어야 하므로 일부러 강한 색을 쓴다.
     제출 전에는 이 표시가 0개여야 한다. */
  mark.gap {
    background: #FFE1E1;
    color: #B00020;
    font-weight: 700;
    padding: 0 1mm;
    border: 1px dashed #D06060;
    border-radius: 2px;
  }

  /* ---------------------------------------------------------------
     아래는 포트폴리오·이력서 첫 화면용. ```html-raw 블록에서만 쓰인다.
     --------------------------------------------------------------- */

  /* 장 나눔 */
  .pagebreak { break-before: page; page-break-before: always; height: 0; }

  /* 표지 부제·메타 */
  .lead { font-size: 11.4pt; line-height: 1.5; color: var(--ink-2); margin: 0 0 1.2mm; }
  .meta {
    font-size: 8.8pt;
    color: var(--muted);
    margin: 0 0 3mm;
    padding-bottom: 2.6mm;
    border-bottom: 1px solid var(--line);
  }

  /* 메타 바로 다음 문단이 링크 줄이면 알약 모양으로 */
  .meta + p { font-size: 0; margin: 0 0 3.2mm; line-height: 1; }
  .meta + p a {
    display: inline-block;
    font-size: 8.6pt;
    line-height: 1;
    padding: 1.4mm 2.6mm;
    margin: 0 1.6mm 1.6mm 0;
    border: 1px solid var(--accent-line);
    background: var(--accent-bg);
    border-radius: 99px;
    color: var(--accent);
    font-weight: 500;
  }

  /* 목차 */
  .toc { font-size: 9.4pt; border: 1px solid var(--line); border-radius: 5px; padding: 3mm 4mm; margin: 0 0 4mm; background: var(--bg); }
  .toc div { margin: 0.6mm 0; }
  .toc .num { display: inline-block; width: 7mm; color: var(--accent); font-weight: 700; }
  .toc .tocd { color: var(--muted); font-size: 8.8pt; }

  /* 핵심 수치 카드. 이력서·포트폴리오 첫 화면 */
  .kpi { display: flex; gap: 3.2mm; margin: 1mm 0 3mm; break-inside: avoid; page-break-inside: avoid; }
  .kpi > div {
    flex: 1;
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-top: 3px solid var(--accent);
    border-radius: 5px;
    padding: 2.2mm 3mm 2mm;
  }
  .kpi b {
    display: block;
    font-size: 15pt;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.15;
    color: var(--accent);
  }
  .kpi span { display: block; font-size: 8.6pt; color: var(--muted); line-height: 1.45; margin-top: 1.2mm; }

  /* 범위·전제 상자 */
  .scope {
    background: var(--bg);
    border: 1px solid var(--line);
    border-left: 3.5px solid var(--accent);
    border-radius: 0 5px 5px 0;
    padding: 2.2mm 3.2mm;
    margin: 2mm 0 3.2mm;
    font-size: 9.1pt;
    line-height: 1.55;
    color: var(--ink-2);
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .scope b { color: var(--accent); }

  /* 그림 공통 */
  .fig {
    margin: 2mm 0 3.4mm;
    padding: 2.6mm 3mm 2mm;
    background: var(--bg);
    border: 1px solid var(--line-2);
    border-radius: 5px;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .fig-cap { font-size: 8.6pt; color: var(--muted); margin-top: 2mm; line-height: 1.45; }

  /* 막대 */
  .bar-row { display: flex; align-items: center; gap: 2.4mm; margin: 1.4mm 0; font-size: 9pt; }
  .bar-label { width: 28mm; text-align: right; color: var(--ink-2); flex: none; }
  .bar-track { flex: 1; background: #E3E8EE; height: 4.8mm; border-radius: 2.4mm; overflow: hidden; }
  .bar-fill { background: var(--accent-2); height: 100%; border-radius: 2.4mm; min-width: 1mm; }
  .bar-fill.after { background: var(--good); }
  .bar-val { width: 16mm; text-align: right; font-weight: 700; color: var(--ink); flex: none; }

  /* 흐름도 */
  .flow { display: flex; align-items: stretch; gap: 0; font-size: 8.6pt; }
  .flow-step {
    flex: 1;
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 2mm 1.4mm;
    text-align: center;
    line-height: 1.4;
  }
  .flow-step b { display: block; font-size: 9.2pt; font-weight: 700; margin-bottom: 0.8mm; color: var(--ink); }
  .flow-step span { color: var(--muted); }
  .flow-arrow { display: flex; align-items: center; padding: 0 1mm; color: var(--accent-2); font-size: 13pt; font-weight: 700; }

  /* 변경 전·후 대비 상자 */
  .compare { display: flex; gap: 3.2mm; margin: 2.4mm 0 3.2mm; break-inside: avoid; page-break-inside: avoid; }
  .compare > div {
    flex: 1;
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2.2mm 3mm 2.4mm;
    font-size: 9.2pt;
    line-height: 1.55;
  }
  .compare > div:first-child { border-top: 3px solid var(--warn); }
  .compare > div:last-child { border-top: 3px solid var(--good); }
  .compare h5 { margin: 0 0 1.2mm; font-size: 8.4pt; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }
  .compare > div:first-child h5 { color: var(--warn); }
  .compare > div:last-child h5 { color: var(--good); }
  .compare b { color: var(--ink); }

  /* 2열 카드 */
  .mini-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.8mm;
    margin: 2mm 0 3.2mm;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .mini-grid > div {
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 2.2mm 3mm;
    font-size: 9pt;
    line-height: 1.5;
    color: var(--ink-2);
  }
  .mini-grid b { display: block; margin-bottom: 0.6mm; color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
<!--CONTENT-->
</body>
</html>
