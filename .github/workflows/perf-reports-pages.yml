# 성능 보고서를 GitHub Pages로 게시한다.
#
# 왜 필요한가
#   report.html / history.html 을 저장소에 커밋해도 GitHub 웹에서는 렌더링되지 않고
#   raw 다운로드만 된다. 즉 커밋해 둔 보고서를 사람이 링크 하나로 볼 방법이 없다.
#   Pages로 올리면 history.html이 라이브 대시보드가 되고, 그 안의 상대 링크를 통해
#   개별 실행 보고서까지 그대로 열린다.
#
# 게시 대상은 performance/reports/ 전체다. 디렉터리 구조를 그대로 올려야
# history.html -> runs/<runId>/report.html 상대 링크가 살아 있다.
#
# 활성화 (저장소 설정에서 1회):
#   Settings > Pages > Build and deployment > Source: GitHub Actions

name: perf-reports-pages

on:
  push:
    branches: [develop, main]
    paths:
      - "performance/reports/**"
      - "performance/tools/**"
      - ".github/workflows/perf-reports-pages.yml"
  workflow_dispatch:

# 동시 배포를 막는다. 여러 푸시가 겹쳐도 마지막 것만 올라가면 된다.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 커밋된 history.html을 그대로 쓰지 않고 다시 만든다.
      # 개별 실행을 커밋하면서 history 갱신을 깜빡하면 대시보드가 조용히 낡기 때문에,
      # 게시 시점에 index.json으로부터 재생성해 항상 일치시킨다.
      - name: Regenerate history dashboard
        working-directory: performance
        run: |
          if [ -f reports/index.json ]; then
            node tools/history.js
          else
            echo "reports/index.json 이 없습니다 — 아직 수집된 실행이 없는 상태로 게시합니다."
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r performance/reports/. _site/

          # overnight/ 는 게시하지 않는다.
          #
          # 러너의 원시 stdout 이라 읽는 사람에게 주는 정보가 사실상 없는데(보고서가 아니라
          # 진행 로그다), 구조가 없는 텍스트라 정화기가 값을 배울 근거인 run.json 과
          # 연결되지 않는 내용이 섞여 들어온다 — 내부 실험 ID, 작업 브랜치 이름, 경로.
          # 실측(2026-09-05): 이 디렉터리의 로그 17개에 `personal/localdocs` 가 원문으로
          # 남아 있었다. **가치는 낮고 위험은 가장 큰 묶음이라 통째로 뺀다.**
          # 저장소의 원본(performance/reports/overnight/)은 그대로 두어 분석에는 영향이 없다.
          rm -rf _site/overnight

          # Pages의 진입점은 index.html 이다. history.html 이 곧 랜딩 페이지가 된다.
          if [ -f _site/history.html ]; then
            cp _site/history.html _site/index.html
          fi
          # Jekyll이 밑줄로 시작하는 경로를 삼키지 않도록 비활성화한다.
          touch _site/.nojekyll
          echo "게시 대상:"
          find _site -maxdepth 1 -mindepth 1 -printf "  %f\n" | sort

      # 내부 실행 메타데이터를 지운다(E-29). **비공개 저장소라도 Pages 사이트는 기본적으로
      # 공개**다 — 비공개 Pages 는 Enterprise Cloud 기능이다. 그래서 실행자(사용자명@호스트명),
      # 내부 접속 주소, 커밋 해시, 브랜치, 실행 메모를 게시본에서만 제거한다.
      # 저장소의 원본(performance/reports/)은 그대로 두어 로컬 분석에는 영향이 없다.
      #
      # 이 단계가 실패하면 배포도 멈춘다. 정화되지 않은 보고서를 올리는 것보다 게시가
      # 안 되는 편이 낫다 — sanitize-reports.js 는 지울 값을 못 찾으면 스스로 실패한다.
      - name: Redact internal metadata before publishing
        working-directory: performance
        run: node tools/sanitize-reports.js ../_site

      # 정화가 실제로 됐는지 게시 직전에 다시 판정한다. 위 단계의 성공 여부와 별개로
      # 산출물을 검사하므로, 단계 순서가 어긋나거나 도구가 바뀌어도 잡힌다.
      #
      # `--source reports` 가 핵심이다. 지울 값을 **정화 전 원본**에서 배우고, 찾기는
      # 게시본에서 한다. 이걸 빼면 정화된 게시본에서 값을 배우게 되는데 그 값은 전부
      # `redacted` 라 찾을 대상이 0개가 되고, 검사는 무엇이 남아 있든 항상 통과한다.
      # 실제로 그렇게 통과했다 — 호스트명이 파일 159개에 남은 게시본을 통과시켰다.
      - name: Verify no internal metadata remains
        working-directory: performance
        run: node tools/sanitize-reports.js ../_site --verify --source reports

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
