name: Deploy to EC2

# ============================================================
# 자동 배포를 멈춰 둔 상태다 (2026-09-09).
#
# EC2 인스턴스를 내려 두었고 ECR 저장소도 남아 있지 않다. 그래서 main 에 푸시할
# 때마다 build 잡이 `RepositoryNotFoundException` 으로 실패하고, 커밋마다 빨간 X 가
# 붙었다. 파이프라인이 고장난 것이 아니라 배포 대상 인프라가 없는 것이므로,
# 워크플로를 지우지 않고 스위치만 내렸다.
#
# 되살리는 방법: EC2 와 ECR 을 올린 뒤 저장소 변수를 켠다.
#   gh variable set DEPLOY_ENABLED --body true
# 한 번만 배포하려면 Actions 탭에서 Run workflow 로 수동 실행한다.
#
# test 잡에는 스위치를 걸지 않았다. 배포하지 않아도 main 푸시에서 테스트는
# 계속 돌아야 한다.
# ============================================================

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: highteenday-backend

jobs:
  # ============================================================
  # Job 0: Test gate — 이 잡이 실패하면 이미지 빌드도 배포도 하지 않는다.
  #
  # 이전에는 이 워크플로에 테스트 단계가 아예 없었고 Dockerfile 도 `-x test` 라,
  # 깨진 코드가 그대로 ECR 에 올라가 EC2 까지 갔다 (docs/KNOWN-ISSUES.md KI-12).
  # 이미지 빌드 안에서 테스트를 돌리지 않고 잡을 분리한 이유는, 실패했을 때
  # 테스트 리포트를 아티팩트로 꺼낼 수 있고 Gradle 캐시가 도커 레이어 캐시와
  # 섞이지 않기 때문이다.
  # ============================================================
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  # ============================================================
  # Job 1: Build Docker image on GitHub runner → push to ECR
  # ============================================================
  build:
    runs-on: ubuntu-latest
    needs: test
    # 배포 대상 인프라가 없는 동안 이미지 빌드와 배포를 건너뛴다(위 머리말).
    # 이 잡이 건너뛰어지면 needs 로 매달린 deploy 잡도 함께 건너뛰어진다.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true' }}
    permissions:
      id-token: write   # required for OIDC
      contents: read

    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::356630933123:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY \
            || aws ecr create-repository --repository-name $ECR_REPOSITORY

      - name: Build and push image to ECR
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE=$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker build -t $IMAGE -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $IMAGE
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # ============================================================
  # Job 2: SSH to EC2 → pull image from ECR → restart container
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write   # required for OIDC
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::356630933123:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,DB_URL,DB_USERNAME,DB_PASSWORD,REDIS_HOST,REDIS_PORT,JWT_KEY,S3_BUCKET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,NEIS_API_KEY
          script: |
            # Clone repo on first deploy, otherwise pull latest
            if [ ! -d ~/app ]; then
              git clone https://github.com/${{ github.repository }}.git ~/app
            fi
            cd ~/app
            git fetch origin
            git reset --hard origin/main
            # Remove default compose file to prevent merging with prod config
            rm -f docker-compose.yml

            # Login to ECR using EC2 Instance Profile (no static keys needed)
            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin \
              356630933123.dkr.ecr.ap-northeast-2.amazonaws.com

            # Write all values from GitHub Secrets
            printf 'ECR_IMAGE=%s\n'            "$IMAGE"               > .env
            printf 'DB_URL=%s\n'               "$DB_URL"             >> .env
            printf 'DB_USERNAME=%s\n'          "$DB_USERNAME"        >> .env
            printf 'DB_PASSWORD=%s\n'          "$DB_PASSWORD"        >> .env
            printf 'REDIS_HOST=%s\n'           "$REDIS_HOST"         >> .env
            printf 'REDIS_PORT=%s\n'           "$REDIS_PORT"         >> .env
            printf 'JWT_KEY=%s\n'              "$JWT_KEY"            >> .env
            printf 'S3_BUCKET=%s\n'            "$S3_BUCKET"          >> .env
            printf 'GOOGLE_CLIENT_ID=%s\n'     "$GOOGLE_CLIENT_ID"   >> .env
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET" >> .env
            printf 'NEIS_API_KEY=%s\n'         "$NEIS_API_KEY"       >> .env

            # 이전 이미지를 기록해 둔다. 새 배포가 헬스체크를 통과하지 못하면 여기로 되돌린다.
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' highteenday-app 2>/dev/null || echo "")
            echo "Previous image: ${PREVIOUS_IMAGE:-none}"

            # Pull pre-built image from ECR and restart (no build on EC2)
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate

            # ------------------------------------------------------------
            # 기동 확인 (docs/KNOWN-ISSUES.md KI-48)
            #
            # 예전에는 `up -d` 로 끝나서, 컨테이너가 기동 직후 죽어도 워크플로는 성공으로
            # 남고 장애를 사람이 발견할 때까지 몰랐다. actuator 헬스가 UP 이 될 때까지
            # 기다리고, 안 되면 로그를 남긴 뒤 이전 이미지로 되돌리고 실패로 끝낸다.
            #
            # 포트 8081: application-prod.properties 의 management.server.port.
            # network_mode: host 라 EC2 의 localhost 로 바로 닿는다.
            # ------------------------------------------------------------
            HEALTH_URL="http://localhost:8081/actuator/health"
            DEADLINE=$((SECONDS + 120))
            HEALTHY=0

            echo "Waiting for $HEALTH_URL to report UP (timeout 120s)..."
            while [ $SECONDS -lt $DEADLINE ]; do
              # 컨테이너가 이미 죽었다면 더 기다릴 이유가 없다.
              if [ -z "$(docker ps -q -f name=highteenday-app)" ]; then
                echo "Container is not running any more."
                break
              fi
              if curl -fsS --max-time 5 "$HEALTH_URL" 2>/dev/null | grep -q '"status":"UP"'; then
                HEALTHY=1
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" != "1" ]; then
              echo "::error::Health check failed. The new container did not become healthy."
              echo "----- container status -----"
              docker ps -a -f name=highteenday-app
              echo "----- last 200 log lines -----"
              docker logs --tail 200 highteenday-app 2>&1 || true

              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "Rolling back to $PREVIOUS_IMAGE"
                ECR_IMAGE="$PREVIOUS_IMAGE" \
                  docker compose -f docker-compose.prod.yml --env-file .env up -d --force-recreate
              else
                echo "No previous image recorded — leaving the failed container for inspection."
              fi
              exit 1
            fi

            echo "Health check passed. Deployment is live."
