plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// DB 마이그레이션. flyway-mysql 은 MySQL 8 방언 지원을 위해 별도로 필요
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	compileOnly 'org.projectlombok:lombok:1.18.30'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// 인가 규칙을 테스트로 고정하기 위해 필요하다 (KI-52). @WithMockUser 와
	// SecurityMockMvcRequestPostProcessors 가 여기서 온다.
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client' // OAuth2 라이브러리 추가
	implementation 'org.springframework.boot:spring-boot-starter-security' // security 추가
	implementation 'software.amazon.awssdk:s3:2.26.0' //s3
	implementation 'org.jsoup:jsoup:1.17.2' //htmlUrlParsing
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0' //swagger ui
	//jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
	//aop
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	//websocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	//redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	// validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// QueryDsl
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	//쿼리 로깅
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.12.1'

	//json 데이터 타입 지원
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
	//health check actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	//actuator 지표를 Prometheus 포맷으로 노출 (performance/ 부하 테스트 관측용)
	implementation 'io.micrometer:micrometer-registry-prometheus'
}

// p6spy(datasource-decorator-spring-boot-autoconfigure)가 자체적으로 더 새 버전의
// spring-boot-dependencies BOM을 함께 끌고 들어와, io.prometheus:* 계열 라이브러리가
// 서로 다른 버전(1.3.6 / 1.3.10)으로 섞여 classpath에 올라간다. 그 상태로 Prometheus
// 메트릭 노출을 켜면 NoSuchMethodError로 기동 자체가 실패한다 — 버전을 강제로 통일한다.
configurations.all {
	resolutionStrategy {
		force 'io.prometheus:prometheus-metrics-config:1.3.6'
		force 'io.prometheus:prometheus-metrics-core:1.3.6'
		force 'io.prometheus:prometheus-metrics-exposition-formats:1.3.6'
		force 'io.prometheus:prometheus-metrics-exposition-textformats:1.3.6'
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// 마이그레이션은 MySQL 문법이고 테스트는 H2를 쓴다. 테스트 스키마는 Hibernate가 만든다.
	systemProperty 'spring.flyway.enabled', 'false'
}
