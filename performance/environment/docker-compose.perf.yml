# 성능 테스트 전용 스택 — 모든 실험은 이 컴포즈로 띄운 동일 환경에서 실행한다.
#
#   docker compose -f environment/docker-compose.perf.yml --env-file environment/.env.perf up -d
#
# 운영 스택(docker-compose.prod.yml)과의 차이:
#  - 리소스 상한을 명시(cpus/mem_limit)해 어떤 호스트에서도 같은 조건 재현
#  - Prometheus + Grafana + exporter 동봉 (관측 없는 부하 테스트는 무의미)
#  - MySQL/Redis 설정 파일 고정 (버퍼풀, maxmemory 등이 암묵 기본값에 좌우되지 않도록)

services:
  mysql:
    image: mysql:8.0.36
    container_name: perf-mysql
    restart: unless-stopped
    # environment/mysql/perf.cnf를 파일로 마운트하는 대신 CLI 플래그로 직접 전달한다.
    # 이유(실측 확인됨): Windows 호스트에서 Docker Desktop이 바인드 마운트하는 파일은
    # world-writable 권한으로 올라가는데, mysqld는 world-writable 설정 파일을
    # "[Warning] World-writable config file ... is ignored"로 자동 무시하고 조용히
    # 기본값으로 기동한다 — buffer pool 128MB, slow log OFF, max_connections 151 등
    # 전부 의도한 값이 아니게 된다(경고만 뜨고 실패하지 않아 눈치채기 어렵다).
    # CLI 플래그는 이 검사 대상이 아니므로 호스트 OS와 무관하게 항상 적용된다.
    command:
      - --innodb-buffer-pool-size=1G
      - --innodb-log-buffer-size=32M
      - --max-connections=200
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
      - --slow-query-log=1
      - --slow-query-log-file=/var/lib/mysql/slow.log
      - --long-query-time=0.1
      - --log-queries-not-using-indexes=1
      - --performance-schema=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      # Token 엔티티/마이그레이션 대소문자 불일치 우회 (BTL-008 참고).
      # ⚠ 데이터 디렉터리 최초 초기화 시점에만 적용된다.
      - --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-perfroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-highteenday}
      TZ: Asia/Seoul
    ports:
      # 루프백 전용(E-14). root 비밀번호 기본값이 `perfroot`이라 0.0.0.0 에 붙으면 같은
      # 네트워크의 누구나 시드 데이터 전체를 읽고 쓸 수 있다. 호스트에서 돌리는 도구
      # (seed.js·SQL 검증)는 127.0.0.1 로 그대로 접속된다.
      - "127.0.0.1:${MYSQL_HOST_PORT:-13316}:3306"   # 로컬 MySQL(3306)과 충돌 방지용 기본 포트
    volumes:
      - perf-mysql-data:/var/lib/mysql
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-perfroot}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: perf-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      # 루프백 전용(E-14). 이 Redis 는 인증이 없어(redis-perf.conf 에 requirepass 없음)
      # 0.0.0.0 에 붙으면 누구나 FLUSHALL 로 캐시를 날리거나 세션을 읽을 수 있다.
      - "127.0.0.1:${REDIS_HOST_PORT:-16389}:6379"   # 로컬 Redis(6379)와 충돌 방지용 기본 포트
    volumes:
      - ./redis/redis-perf.conf:/usr/local/etc/redis/redis.conf:ro
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..          # highteenday-backend 루트의 Dockerfile 사용 (이 파일은 performance/environment/ 아래)
      dockerfile: Dockerfile
    # Dockerfile의 ENTRYPOINT가 --spring.profiles.active=prod로 고정되어 있어
    # SPRING_PROFILES_ACTIVE 환경변수만으로는 프로파일을 못 바꾼다(커맨드라인 인자가 우선).
    # 여기서 entrypoint 자체를 덮어써 prod,perf 프로파일 조합으로 강제한다.
    # - prod: AppStartupRunner(@Profile("!prod")) 비활성화 — dev/local은 빈 DB에서 무한 크래시(BTL 문서 참고)
    # - perf: prod가 하드코딩한 쿠키 Domain=.highteenday.org / Secure=true를 되돌린다.
    #   그 상태로는 localhost + HTTP 부하 테스트에서 세션 쿠키가 전혀 재전송되지 않아
    #   로그인 이후 모든 인증 요청이 401로 실패한다(실측 확인됨, application-perf.properties 참고).
    entrypoint: ["java", "-jar", "app.jar", "--spring.profiles.active=${SPRING_PROFILE:-prod,perf}"]
    container_name: perf-app
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      # 기본은 루프백이다(E-14). 다만 부하 발생기를 다른 호스트로 분리하면(E-01) 원격
      # k6 가 이 포트에 붙어야 하므로, 그때만 APP_BIND_ADDR=0.0.0.0 으로 **명시적으로**
      # 연다. 기본값이 열려 있는 것과 필요할 때 여는 것은 다르다.
      - "${APP_BIND_ADDR:-127.0.0.1}:${APP_HOST_PORT:-18080}:8080"   # 로컬에서 이미 8080을 쓰는 프로세스와 충돌 방지
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-highteenday}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-perfroot}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # HS512는 최소 64바이트 키가 필요하다 (짧으면 로그인/회원가입이 500으로 실패 — 실측 확인됨).
      #
      # 기본값을 두지 않는다(E-34). 예전에는 실행 가능한 실제 키가 `:-` 기본값으로 커밋돼
      # 있었다. 저장소를 읽을 수 있는 사람은 누구나 그 키로 토큰을 위조할 수 있고, 운영이
      # 같은 키를 쓰고 있었다면 그대로 운영 토큰 위조가 된다. 편의를 위한 기본값 하나가
      # 저장소 접근 권한을 인증 우회 권한으로 바꾼다.
      #
      # 값이 없으면 컨테이너가 뜨지 않는다 — 조용히 약한 키로 뜨는 것보다 낫다.
      # 생성: openssl rand -base64 64   (환경 변수 또는 .env.perf 에 넣는다)
      JWT_KEY: ${JWT_KEY:?JWT_KEY 를 지정해야 한다 - openssl rand -base64 64 로 생성해 .env.perf 에 넣을 것}
      # OAuth2/NEIS 자리표시자 — 기본값이 없는 프로퍼티라 값이 없으면 컨텍스트 로딩 자체가
      # 실패한다(PlaceholderResolutionException). 부하 테스트 경로(로그인/회원가입/글쓰기 등)는
      # 이 값들을 실제로 쓰지 않으므로 더미로 충분하다.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-perf-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-perf-dummy-client-secret}
      NEIS_API_KEY: ${NEIS_API_KEY:-perf-dummy-neis-key}
      S3_BUCKET: ${S3_BUCKET:-perf-dummy-bucket}
      # 관측/재현성 핵심 — 힙 고정 + GC 로그 + JFR 상시 기록
      JAVA_TOOL_OPTIONS: >-
        -Xms1g -Xmx1g
        -XX:+UseG1GC -XX:MaxGCPauseMillis=200
        -Xlog:gc*:file=/tmp/gc.log:time,uptime:filecount=5,filesize=20m
        -XX:StartFlightRecording=disk=true,maxsize=200m,dumponexit=true,filename=/tmp/perf.jfr
        -Djava.rmi.server.hostname=localhost
      # HikariCP 풀 크기 — 실험용 노브(EXP-006). 기본값 10 은 HikariCP 자체 기본값과
      # 같으므로, 이 변수를 지정하지 않으면 지금까지의 모든 실행과 동일하게 돈다.
      # minimumIdle 은 지정하지 않는다 — HikariCP 기본값이 maximumPoolSize 와 같아
      # 고정 크기 풀이 되고, 그래야 "실행 중 풀이 자라는" 변수가 생기지 않는다.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAX:-10}
      # Micrometer Prometheus 노출 (environment/README.md 사전 준비 참고)
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus,metrics
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
    deploy:
      resources:
        # 메모리는 힙(1G)의 약 2.5배로 잡는다. 1536m 이던 시절 실측:
        #   anon 1518MB / 한계 1536MB, memory.events 의 max 992회(= 강제 회수), oom_kill 0
        # JVM 은 힙 외에도 비힙 ~200MB, 스레드 스택, GC 구조체를 네이티브로 쓰므로
        # -Xmx1g 짜리 프로세스의 실제 풋프린트가 1.5GB 였다. 한계와 같아 여유가 0이었고,
        # 커널이 계속 회수하며 버티는 상태였다(OOM 은 없었지만 정상도 아니다).
        #
        # 그 결과 실행 71건 중 43건이 메모리 포화 100% 로 기록돼, 포화도 지표가 항상
        # 빨간색이라 신호로서 죽어 있었다. 힙을 줄이지 않고 한계를 올린 이유는
        # "힙 고정으로 측정 노이즈를 없앤다"는 이 환경의 원칙을 유지하기 위해서다.
        limits: { cpus: "2.0", memory: 2560m }

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: perf-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver   # k6 experimental-prometheus-rw 수신
      # k6 가 보내는 trend 지표를 **native histogram** 으로 받기 위해 필요하다.
      # 이게 없으면 remote-write 는 성공하는데 히스토그램 계열만 조용히 버려진다
      # (k6 는 에러를 내지 않는다). 왜 native histogram 이어야 하는지는 perf-run.js 의
      # remoteWriteEnv() 주석 참고 — 요약하면 분위수는 합산되지 않아서, 계산된 p95 를
      # 받아 두면 임의 구간(예: measure 앞 5분)의 p95 를 사후에 정확히 못 구한다.
      #
      # ⚠ 부작용을 하나 막아 뒀다. 이 플래그는 **스크레이프 프로토콜 협상도 바꾼다** —
      # 켜면 Prometheus 가 타깃에 protobuf 를 먼저 요청한다. 그러면 앱·MySQL·Redis 의
      # 지표가 지금까지와 다른 인코딩으로 들어와, 수집 경로가 바뀐 실행과 안 바뀐 실행이
      # 한 계열에 섞인다. prometheus.yml 의 `scrape_protocols` 에 기존 목록을
      # **명시적으로 고정**해 그 협상을 원래대로 묶어 뒀다.
      - --enable-feature=native-histograms
    ports:
      # 루프백에만 바인딩한다(E-14). `"9090:9090"` 은 0.0.0.0 에 붙어 같은 네트워크의
      # 누구나 접근할 수 있는데, 위 remote-write 수신기에는 **인증이 없다**. 즉 외부에서
      # 임의 지표를 써 넣어 측정을 오염시키거나, 질의 API로 전체 지표를 읽어 갈 수 있다.
      # 카페·회사 공용 와이파이에서 부하 테스트를 돌리면 그대로 노출된다.
      # 원격 접근이 필요하면 SSH 터널을 쓴다: ssh -L 9090:localhost:9090 <host>
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - perf-prom-data:/prometheus

  grafana:
    image: grafana/grafana:10.4.0
    container_name: perf-grafana
    restart: unless-stopped
    ports:
      # Prometheus와 같은 이유로 루프백에만 바인딩한다(E-14). 여기는 익명 접근이 켜져
      # 있고(GF_AUTH_ANONYMOUS_ENABLED) 관리자 비밀번호 기본값도 약해서, 0.0.0.0 에
      # 붙으면 같은 네트워크의 누구나 대시보드를 열람할 수 있다.
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-perf}
      # 익명 열람 허용은 로컬 전용 편의 설정이다. 위 포트 바인딩이 루프백이라는 전제에서만
      # 안전하다 — 바인딩을 바꾸려면 이 설정도 함께 재검토할 것.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../metrics/dashboards:/var/lib/grafana/dashboards:ro
      - perf-grafana-data:/var/lib/grafana

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: perf-mysqld-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=root
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-perfroot}
    depends_on:
      mysql: { condition: service_healthy }

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: perf-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: { condition: service_healthy }

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: perf-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # 호스트 전체의 포화도(E-09). cAdvisor는 컨테이너 **하나하나**를 보지만, 그것들이
  # 합쳐서 머신을 얼마나 먹었는지는 보지 못한다. 컨테이너 CPU가 전부 한가해 보여도
  # 호스트의 run queue가 길면 응답시간은 늘어난다 — 그 경우를 설명할 지표가 없었다.
  #
  # **무엇을 보는지 정확히 알아야 한다.** Docker Desktop은 WSL2 백엔드이므로 이 컨테이너가
  # 보는 "호스트"는 Windows가 아니라 **WSL2 VM**이다(커널 6.18-microsoft-standard-WSL2,
  # CPU 20, 메모리 16.5GB). 앱·MySQL·Redis는 그 안에 있으므로 정확히 측정되지만,
  # Windows에서 직접 실행하는 k6.exe는 **이 지표에 잡히지 않는다.** 부하 발생기까지 보려면
  # k6를 컨테이너로 돌려야 한다(`perf-run.js --loadgen docker`).
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: perf-node-exporter
    restart: unless-stopped
    # pid: host 는 프로세스 단위 지표(hwmon/processes collector)에 필요하다.
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      # 컨테이너 오버레이 파일시스템을 빼지 않으면 디스크 지표가 수십 개로 불어나
      # 정작 봐야 할 실제 볼륨이 묻힌다.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|host/root/var/lib/docker/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # 보통 예제는 `:ro,rslave` 를 쓰지만 WSL2 의 `/` 는 shared/slave 마운트가 아니라
      # 데몬이 거부한다("path / is mounted on / but it is not a shared or slave mount").
      # rslave 는 실행 중 새로 붙는 마운트를 따라가기 위한 것이고, 여기서 필요한 CPU·
      # 메모리·load 지표는 전부 /proc 와 /sys 에서 나오므로 없어도 된다.
      - /:/host/root:ro

volumes:
  # 데이터셋 프로파일마다 MySQL 볼륨을 분리한다.
  #
  # 이유: 시드는 API 기반이라 large 이상은 적재에 수 시간이 걸린다. 볼륨이 하나뿐이면
  # 프로파일 전환 = down -v + 전체 재시드가 되어, 한 번 large로 넘어가면 small로
  # 되돌아오는 비용이 비현실적이 된다. 규모별 비교(예: 페이징 병목이 large에서만
  # 재현되는가)는 프로파일 간 왕복이 싸야 성립한다.
  #
  # 볼륨을 분리하면 시드 비용은 프로파일당 1회만 내고, 이후 전환은 컨테이너 재생성
  # 수준으로 끝난다. 교차 오염(시드 중복 실행 등)도 다른 프로파일로 번지지 않는다.
  #
  # 전환:  DATASET_PROFILE=large docker compose -f ... up -d
  # 주의:  MySQL만 분리된다. Redis는 볼륨이 없어 프로파일이 바뀌어도 컨테이너가
  #        재생성되지 않으면 이전 프로파일의 캐시/카운터가 남는다 —
  #        전환 시 반드시 FLUSHALL 할 것 (environment/bootstrap.js가 자동으로 처리).
  perf-mysql-data:
    name: perf-mysql-data-${DATASET_PROFILE:-medium}
  perf-prom-data:
  perf-grafana-data:
