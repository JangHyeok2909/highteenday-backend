# Redis 7 성능 테스트 고정 설정
# maxmemory를 명시해 eviction 거동까지 실험 대상에 포함시킨다.
maxmemory 384mb
maxmemory-policy allkeys-lru

# 부하 테스트 중 디스크 fork(RDB)가 지연 스파이크를 만들지 않도록 저장 비활성.
# (운영에서 RDB/AOF를 쓴다면 failover 실험 시에는 운영과 동일하게 켜고 비교할 것)
save ""
appendonly no

# 관측: 1ms 이상 명령 기록
slowlog-log-slower-than 1000
slowlog-max-len 1024
latency-monitor-threshold 100

# 키스페이스 이벤트 (캐시 만료 관찰용)
notify-keyspace-events Ex
