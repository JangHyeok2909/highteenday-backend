# ==============================
# Test Environment
#
# @SpringBootTest 로 전체 컨텍스트를 띄우는 테스트용 프로파일이다.
# application.properties 위에 얹혀 DB/외부 연동 설정만 갈아끼운다.
#
# 이미 코드에 test 프로파일 규약이 있다: S3Config 와 S3FileStorageAdapter 가
# @Profile("!test") 이고, 그 자리를 TestFileStorageConfig 의 LocalFileStorageAdapter 가 채운다.
# ==============================

# ==============================
# DB — H2 in-memory
#
# application.properties 는 드라이버와 방언을 MySQL로 고정해 두었다.
# 그대로 두면 H2 URL에 MySQL 드라이버가 붙어 HikariCP가 부팅에 실패하므로 둘 다 덮어쓴다.
# ==============================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 테스트 스키마는 Hibernate가 만든다. 마이그레이션은 MySQL 문법이라 H2에서 돌지 않는다.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# ==============================
# Redis
# 커넥션은 실제로 쓰일 때 열린다. 컨텍스트 로딩만 하는 테스트는 서버가 없어도 통과한다.
# 실제로 Redis를 쓰는 테스트는 embedded-redis 를 직접 띄운다.
# ==============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==============================
# 외부 연동 자리채우기
# 값이 없으면 @Value 주입이 실패해 컨텍스트가 뜨지 않는다. 실제로 호출하지는 않는다.
# ==============================
jwt.key=test-only-jwt-signing-key-must-be-at-least-32-bytes-long-0123456789
neis.api.key=test-neis-api-key
cloud.aws.s3.bucket=test-bucket
app.cors.allowed-origins=http://localhost:3000
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# ==============================
# Logging — 테스트 출력은 조용하게
# ==============================
logging.level.com.example.highteenday_backend=WARN
logging.level.org.hibernate.SQL=WARN
decorator.datasource.p6spy.enable-logging=false
logging.level.p6spy=warn
