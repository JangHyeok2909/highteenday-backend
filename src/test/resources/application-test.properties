# ==============================================================================
# test profile: @SpringBootTest with the full application context.
# Loaded on top of application.properties and replaces only the database and
# external integration settings. S3Config and S3FileStorageAdapter are
# @Profile("!test"); TestFileStorageConfig supplies a LocalFileStorageAdapter
# in their place.
# ==============================================================================


# ==============================
# Datasource and JPA (H2 in memory)
# application.properties pins the MySQL driver and dialect. Left as they are,
# the MySQL driver meets the H2 URL and HikariCP fails at startup, so both are
# overridden here.
# ==============================

# In-memory H2 in MySQL compatibility mode. DB_CLOSE_DELAY=-1 keeps the
# database while the JVM runs; DB_CLOSE_ON_EXIT=FALSE leaves shutdown to
# Spring.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# H2 JDBC driver.
spring.datasource.driver-class-name=org.h2.Driver

# H2 user.
spring.datasource.username=sa

# H2 password (empty).
spring.datasource.password=

# Hibernate SQL dialect for H2.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate creates the schema at startup and drops it at shutdown.
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway off: the migrations use MySQL syntax and do not run on H2.
spring.flyway.enabled=false

# Never runs schema.sql or data.sql.
spring.sql.init.mode=never

# Open Session in View off: the persistence context closes with each
# transaction instead of staying open for the whole request.
spring.jpa.open-in-view=false


# ==============================
# Redis
# Lettuce connects on first use, so tests that only load the context pass
# without a Redis server.
# ==============================

# Redis host.
spring.data.redis.host=localhost

# Redis port.
spring.data.redis.port=6379


# ==============================
# External Integration Placeholders
# Without these keys @Value injection fails and the context does not start.
# The tests never call these services.
# ==============================

# JWT signing key placeholder.
jwt.key=test-only-jwt-signing-key-must-be-at-least-32-bytes-long-0123456789

# NEIS API key placeholder.
neis.api.key=test-neis-api-key

# S3 bucket placeholder.
cloud.aws.s3.bucket=test-bucket

# Browser origins allowed by CORS, the CSRF Origin check and the WebSocket
# handshake. One origin, so tests can tell the list comes from here.
app.cors.allowed-origins=http://localhost:3000

# Google OAuth client ID placeholder.
spring.security.oauth2.client.registration.google.client-id=test-client-id

# Google OAuth client secret placeholder.
spring.security.oauth2.client.registration.google.client-secret=test-client-secret


# ==============================
# Logging
# Keeps test output quiet.
# ==============================

# Log level of the application packages.
logging.level.com.example.highteenday_backend=WARN

# Hibernate SQL statement logging off.
logging.level.org.hibernate.SQL=WARN

# p6spy SQL logging off.
decorator.datasource.p6spy.enable-logging=false

# Level of the p6spy logger that SQL lines go to.
logging.level.p6spy=warn
