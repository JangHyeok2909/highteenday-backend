# ==============================================================================
# Settings shared by every profile.
# application-<profile>.properties overrides any key set here.
#
# Keep this file ASCII-only. IDEs may save .properties files as ISO-8859-1,
# which replaces every non-ASCII character with '?'.
# ==============================================================================


# ==============================
# Application
# ==============================

# Application name. Spring Boot prints it in every log line.
spring.application.name=highteenday-backend

# Profile used when none is given at launch. Override it with
# -Dspring.profiles.active=<local|dev|perf|prod> or an IDE run configuration.
spring.profiles.active=local


# ==============================
# Frontend Redirect and Auth Cookies
# ==============================

# Frontend origin. After OAuth2 login the backend redirects here, and new
# users go to <frontend-url>/welcome.
app.frontend-url=http://localhost:3000

# Secure flag on the accessToken and refreshToken cookies. Off because local
# runs use plain HTTP. JwtCookieService falls back to true when the key is
# missing.
app.cookie-secure=false

# SameSite attribute on the auth cookies. Browsers accept SameSite=None only
# with Secure=true, so change this together with app.cookie-secure.
app.cookie-same-site=Lax

# Browser origins allowed to call this API: the CORS allow list, the CSRF
# Origin check (CsrfOriginValidationFilter) and the WebSocket handshake all
# read this one list. Comma-separated. This default covers a local frontend
# and Swagger UI; each profile overrides it.
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080


# ==============================
# Web Server (Tomcat)
# ==============================

# Maximum worker threads, i.e. requests processed at the same time.
server.tomcat.threads.max=400

# Worker threads kept alive while idle.
server.tomcat.threads.min-spare=50

# OS backlog for new connections once max-connections is reached.
# Connections beyond this queue are refused.
server.tomcat.accept-count=200

# Maximum open connections, including idle keep-alive ones. Requests on these
# connections wait for a free worker thread.
server.tomcat.max-connections=10000

# Registers Tomcat MBeans. Micrometer reads the tomcat.threads.* gauges (busy,
# current, config.max) from them. With the Spring Boot default (false) only
# tomcat.sessions.* is exported. The cost is MBean registration at startup;
# the request path is unaffected.
server.tomcat.mbeanregistry.enabled=true


# ==============================
# Servlet and MVC
# ==============================

# HTTP session idle timeout in seconds (30 minutes). API authentication is
# stateless (JWT cookies); the OAuth2 login flow keeps its authorization
# request in the session between the redirect and the callback.
server.servlet.session.timeout=1800

# Maximum size of one uploaded file.
spring.servlet.multipart.max-file-size=5MB

# Maximum size of a whole multipart request, all files and fields included.
spring.servlet.multipart.max-request-size=5MB

# Enables HiddenHttpMethodFilter: a form POST carrying a _method parameter is
# handled as PUT, PATCH, or DELETE.
spring.mvc.hiddenmethod.filter.enabled=true


# ==============================
# Datasource and JPA (MySQL)
# URL and credentials are profile-specific.
# ==============================

# JDBC driver class (MySQL Connector/J).
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate SQL dialect.
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Maximum wait in ms for one connection checkout from the HikariCP pool.
# This does not cap a whole request or thread: a request that acquires,
# validates, and queries more than once can wait this long at each step.
spring.datasource.hikari.connection-timeout=1000

# Connector/J socket read timeout in ms: the longest wait for a query
# response. Normal-load queries stay under 264 ms, so this leaves over 7x
# headroom.
spring.datasource.hikari.data-source-properties.socketTimeout=2000

# Connector/J TCP connect timeout in ms for a new connection. The database is
# on the same host, so 1 s is enough.
spring.datasource.hikari.data-source-properties.connectTimeout=1000

# JPA query timeout in ms, applied as the JDBC statement timeout. Connector/J
# then sends KILL QUERY to MySQL and keeps the connection instead of dropping
# the socket. Keep it below socketTimeout so this fires first.
spring.jpa.properties.jakarta.persistence.query.timeout=1500


# ==============================
# Flyway (Schema Migration)
# Flyway owns the schema. Changing an entity does not create columns; add a
# migration under db/migration. The procedure is in docs/MIGRATION.md.
# ==============================

# Runs pending migrations at startup.
spring.flyway.enabled=true

# Location of the migration scripts.
spring.flyway.locations=classpath:db/migration

# A non-empty database without Flyway history gets a baseline row instead of
# a startup failure. Such a database skips V1 and continues from V2; an empty
# database runs every migration from V1.
spring.flyway.baseline-on-migrate=true

# Version recorded as the baseline. V1 is the schema that existed before
# Flyway was adopted.
spring.flyway.baseline-version=1

# Description stored with the baseline row in flyway_schema_history.
spring.flyway.baseline-description=schema before Flyway adoption

# Compares applied migrations with the local scripts before migrating and
# fails startup on a checksum mismatch or a missing script.
spring.flyway.validate-on-migrate=true

# Blocks flyway clean, which drops every object in the schema.
spring.flyway.clean-disabled=true

# Empty replaces Flyway's default (*:future). Validation then also fails when
# the database holds a migration newer than this build, e.g. after an app
# rollback.
spring.flyway.ignore-migration-patterns=


# ==============================
# Redis Client (Lettuce)
# Host and port are profile-specific.
# ==============================

# Command timeout. Without it Lettuce waits 60 s. When Redis hangs instead of
# dying (packets dropped), each request then holds a Tomcat thread, and a
# HikariCP connection when called inside a transaction, for the full 60 s.
# In redis-crash-2026-09-11T06-06-22 failed responses had p95 60,003 ms, all
# 10 Hikari connections were in use, and endpoints that never touch Redis
# failed too.
#
# Value: (p95 SLO 500 ms - non-Redis work p95 70 ms) / 4.09 Redis calls per
# request = 105 ms, rounded down to 100 ms. Waiting longer breaks the SLO even
# when every call succeeds. The three inputs come from
# performance/reports/runs/normal-day-2026-09-11T04-34-36 (8-minute window,
# 143,675 Redis commands). The slowest of 1,000,000 commands across five load
# profiles took 5.91 ms, which leaves 16.9x headroom. A lower value fails
# calls against a healthy Redis, and ResilientRedisAspect swallows those
# failures, so view counts drop silently.
#
# Once the circuit breaker opens, calls skip Redis and this wait disappears.
# This is the per-call cap while the circuit is closed, including the time
# the circuit takes to open.
spring.data.redis.timeout=100ms

# Timeout for establishing a connection, not for commands. A same-host
# connect takes about 1 ms and a dead target refuses at once, so 500 ms only
# covers DNS or kernel delays.
spring.data.redis.connect-timeout=500ms


# ==============================
# Redis Circuit Breaker (Resilience4j)
# The instance name "redis" must match ResilientRedisExecutor.INSTANCE_NAME.
# The executor fails startup when the instance is missing, because the
# registry silently creates a default-config circuit for an unknown name.
# ==============================

# Measures the failure rate over time rather than over a call count. At the
# 137 Redis calls/s of the breakpoint run (82,258 fallbacks in a 600 s
# outage), a 20-call window covers only 20 / 137 = 0.15 s. A short stall such
# as a Redis GC pause could then open the circuit and skip 5 s x 137 = 685
# calls. Reads fall back to the DB, but skipped cache evictions
# (evictPostPrev, evictBoard) leave deleted posts in lists until the TTL
# expires.
resilience4j.circuitbreaker.instances.redis.sliding-window-type=TIME_BASED

# Window length. With TIME_BASED the unit is seconds: calls from the last
# 10 s count.
resilience4j.circuitbreaker.instances.redis.sliding-window-size=10

# Minimum calls in the window before the failure rate is evaluated.
resilience4j.circuitbreaker.instances.redis.minimum-number-of-calls=20

# Failure rate (%) at or above which the circuit opens.
resilience4j.circuitbreaker.instances.redis.failure-rate-threshold=50

# How long the circuit stays OPEN before it allows trial calls.
resilience4j.circuitbreaker.instances.redis.wait-duration-in-open-state=5s

# Off: OPEN moves to HALF_OPEN only when a call arrives after the wait, not
# on a timer.
resilience4j.circuitbreaker.instances.redis.automatic-transition-from-open-to-half-open-enabled=false

# Trial calls allowed in HALF_OPEN to decide whether Redis has recovered.
resilience4j.circuitbreaker.instances.redis.permitted-number-of-calls-in-half-open-state=3

# Longest time in HALF_OPEN before the circuit returns to OPEN. The 3 trial
# calls may each need a new connection, costing up to 3 x connect-timeout
# 500 ms = 1.5 s, so 1 s would reopen the circuit before any result arrives.
resilience4j.circuitbreaker.instances.redis.max-wait-duration-in-half-open-state=3s

# Exceptions counted as failures. Must match the catch clause in
# ResilientRedisExecutor.execute: Resilience4j counts any unlisted exception
# as a success, so a mismatch lets fallbacks run while the circuit never
# opens. The Spring supertype also covers raw Lettuce errors such as
# "Connection closed prematurely", which Spring translates to
# RedisSystemException.
#
# DataAccessException includes MySQL errors. Keep DB calls out of code that
# runs through this circuit, or a MySQL outage opens the Redis circuit, turns
# the cache off, and pushes more load onto MySQL. RedisPostsCache.getPostPrevs
# and getCount keep their DB calls outside the circuit for this reason.
resilience4j.circuitbreaker.instances.redis.record-exceptions=org.springframework.dao.DataAccessException

# Number of recent circuit breaker events kept in memory.
resilience4j.circuitbreaker.instances.redis.event-consumer-buffer-size=50

# Off: the circuit state is not added to /actuator/health.
resilience4j.circuitbreaker.instances.redis.register-health-indicator=false


# ==============================
# Actuator and Health Probes
# ==============================

# Base path of the Actuator endpoints.
management.endpoints.web.base-path=/actuator

# Endpoints exposed over HTTP. dev and prod add metrics and prometheus.
management.endpoints.web.exposure.include=health

# Creates /actuator/health/liveness and /actuator/health/readiness. Outside
# Kubernetes they exist only with this key.
management.endpoint.health.probes.enabled=true

# Readiness reflects only the app's own state. The load balancer checks
# /actuator/health/readiness, not /actuator/health.
#
# /actuator/health ANDs five indicators (db, diskSpace, ping, redis, ssl) and
# returns 503 when Redis alone is down, although the app keeps serving. In
# redis-crash-2026-09-11T06-37-20, 972 HTTP requests during a 60 s Redis stop
# had a 0% error rate while all 12 health polls reported DOWN. Every instance
# shares one Redis, so routing on /actuator/health would pull all of them out
# of the target group at once and turn a partial degradation into a full
# outage.
#
# Do not add db or redis here. readinessState is already the default; it is
# written out so such a change stands out. Alerts and investigation still read
# dependency state from /actuator/health.
management.endpoint.health.group.readiness.include=readinessState


# ==============================
# Metrics: Latency Histograms
# Micrometer timers export only count, sum, and max by default. Without
# _bucket series, histogram_quantile() cannot compute server-side p95/p99.
# Each histogram is bounded by minimum/maximum-expected-value: an unbounded
# timer creates 70+ buckets, and http.server.requests multiplies them by
# every uri x method x status combination. Values above the maximum fall into
# the +Inf bucket.
# ==============================

# HTTP request latency: publish histogram buckets.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# HTTP request latency: lowest bucket boundary.
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms

# HTTP request latency: highest bucket boundary.
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

# HikariCP connection acquire time: publish histogram buckets. Shows how long
# requests wait for a pooled connection.
management.metrics.distribution.percentiles-histogram.hikaricp.connections.acquire=true

# HikariCP connection acquire time: lowest bucket boundary.
management.metrics.distribution.minimum-expected-value.hikaricp.connections.acquire=1ms

# HikariCP connection acquire time: highest bucket boundary.
management.metrics.distribution.maximum-expected-value.hikaricp.connections.acquire=30s

# JVM GC pause: publish histogram buckets. Tail pauses, not the average,
# cause latency spikes.
management.metrics.distribution.percentiles-histogram.jvm.gc.pause=true

# JVM GC pause: lowest bucket boundary.
management.metrics.distribution.minimum-expected-value.jvm.gc.pause=1ms

# JVM GC pause: highest bucket boundary. 2 s covers pauses far beyond the G1
# target of the perf environment (-XX:MaxGCPauseMillis=200).
management.metrics.distribution.maximum-expected-value.jvm.gc.pause=2s


# ==============================
# Query Count Metrics (QueryMetricsConfig)
# A p6spy listener counts executed statements, and a servlet filter exports
# them per URI template as http.server.queries and http.server.query.time.
# The report's queries per request (mysql.qps / total RPS) averages over all
# requests and cannot point to the endpoint behind an N+1; these metrics
# attribute queries to endpoints. Cost per statement: one ThreadLocal lookup
# and an integer add. The p6spy proxy is always on already.
# ==============================

# Turns query counting on. Off removes the listener bean entirely.
app.query-metrics.enabled=true

# Per-SQL execution counts and the top entries in the log. Off by default
# because it builds a map per request.
app.query-metrics.detail-enabled=false

# Logs one WARN line for a request that runs at least this many queries.
# -1 disables the log.
app.query-metrics.warn-threshold=30


# ==============================
# Execution Logging (ExecutionLoggingAspect)
# ==============================

# Controller and domain service calls taking at least this many ms log a WARN
# "Slow" line; faster calls log at DEBUG.
app.execution-logging.slow-threshold-ms=300


# ==============================
# Springdoc (OpenAPI and Swagger UI)
# ==============================

# Path of the OpenAPI JSON document.
springdoc.api-docs.path=/swagger/api-docs

# Serves the Swagger UI assets under /swagger instead of the default /webjars.
springdoc.webjars.prefix=/swagger


# ==============================
# AWS
# Bucket name and credentials are profile-specific.
# ==============================

# Region of the S3 client (S3Config).
cloud.aws.region.static=ap-northeast-2


# ==============================
# OAuth2 Login
# client-id and client-secret are profile-specific. To enable Kakao or Naver,
# add the whole registration.<provider>.* block to each profile file once
# credentials exist. Spring Boot rejects a registration with an empty
# client-id, so a partial block breaks startup.
# ==============================

# Google callback URL. {baseUrl} comes from the incoming request; prod
# overrides this with a fixed URL.
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/login/code/{registrationId}

# Google scopes: email address and basic profile.
spring.security.oauth2.client.registration.google.scope=email,profile

# Kakao is not a built-in Spring Security provider, so its fixed public
# endpoints are declared here.

# Kakao: authorization page.
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize

# Kakao: token endpoint.
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token

# Kakao: user info endpoint.
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

# Kakao: user info attribute used as the principal name.
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# Naver is not a built-in Spring Security provider, so its fixed public
# endpoints are declared here.

# Naver: authorization page.
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize

# Naver: token endpoint.
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token

# Naver: user info endpoint.
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me

# Naver: user info attribute used as the principal name. Naver wraps the
# profile fields in a "response" object.
spring.security.oauth2.client.provider.naver.user-name-attribute=response
