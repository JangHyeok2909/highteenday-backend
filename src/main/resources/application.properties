spring.application.name=highteenday-backend

# ==============================
# Actuator
# ==============================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health

# ==============================
# Metrics — 히스토그램 버킷 노출
#
# Micrometer의 Timer는 기본적으로 count/sum/max 만 내보낸다. 이 상태로는
# histogram_quantile()이 쓸 _bucket 시계열이 없어 P95/P99를 서버 관점에서 계산할 수
# 없다(평균은 판정 근거로 쓰지 않는다 — performance/README.md §7). 아래 두 지표는
# 병목 추적 경로(요청 지연 → 커넥션 풀 대기)의 출발점이라 전 환경에서 켠다.
#
# min/max-expected-value로 버킷 범위를 좁히는 이유: 범위를 열어두면 타이머 하나당
# 버킷이 70개 이상 생기고, http.server.requests는 (uri × method × status)마다
# 곱해져 운영 환경에서 시계열 폭증으로 이어진다. 관심 구간 밖은 +Inf로 모인다.
# ==============================
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

# HikariCP 커넥션 획득 대기 — Tomcat 400 스레드 vs 풀 크기 불일치(BTL-002)의 직접 증거.
# 상한은 획득 타임아웃(기본 30s)에 맞춘다. 그래야 타임아웃 직전 꼬리까지 관측된다.
management.metrics.distribution.percentiles-histogram.hikaricp.connections.acquire=true
management.metrics.distribution.minimum-expected-value.hikaricp.connections.acquire=1ms
management.metrics.distribution.maximum-expected-value.hikaricp.connections.acquire=30s

# GC pause — 병목 추적 순서(heap/GC pause → Tomcat busy → HikariCP pending → MySQL)의
# 첫 단계다. 평균 pause는 의미가 없고 꼬리(p99)가 지연 스파이크의 원인이므로 버킷이 필요하다.
# 상한 2s: -XX:MaxGCPauseMillis=200 목표를 크게 벗어난 구간까지 담아 목표 위반을 관측한다.
management.metrics.distribution.percentiles-histogram.jvm.gc.pause=true
management.metrics.distribution.minimum-expected-value.jvm.gc.pause=1ms
management.metrics.distribution.maximum-expected-value.jvm.gc.pause=2s

# ==============================
# Springdoc / Swagger UI
# ==============================
springdoc.api-docs.path=/swagger/api-docs
springdoc.webjars.prefix=/swagger


# ==============================
# Active Profile (default: local)
# Override:
#   Local : -Dspring.profiles.active=local  (or IDE Run Configuration)
#   Dev   : -Dspring.profiles.active=dev
#   Prod  : -Dspring.profiles.active=prod
# ==============================
spring.profiles.active=local
app.frontend-url=http://localhost:3000
app.cookie-secure=false
app.cookie-same-site=Lax

# ==============================
# Tomcat Thread / Connection Tuning
# ==============================
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.accept-count=200
server.tomcat.max-connections=10000
# Micrometer의 tomcat.threads.* (busy/current/config.max) 게이지는 Tomcat MBean에서 값을
# 읽어오므로, 이 레지스트리가 꺼져 있으면 tomcat_sessions_* 만 노출되고 스레드 지표는
# 아예 생성되지 않는다(Spring Boot 기본값 false). 스레드 풀 포화는 BTL-002의 핵심
# 관측 지표라 전 환경에서 켠다. 비용: MBean 등록 오버헤드뿐, 요청 경로에는 영향 없음.
server.tomcat.mbeanregistry.enabled=true

# ==============================
# MVC
# ==============================
spring.mvc.hiddenmethod.filter.enabled=true

# ==============================
# JPA Common
# ==============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ==============================
# Flyway (DB migration)
#
# 스키마는 Flyway가 소유한다. 엔티티를 고쳐도 컬럼이 자동으로 생기지 않으므로
# db/migration 에 마이그레이션을 추가해야 한다. 자세한 절차는 docs/MIGRATION.md 참고.
#
# baseline-on-migrate: Flyway 도입 전부터 존재하던 DB는 V1을 실행하지 않고
#   "이미 적용됨"으로 표시만 하고 V2부터 진행한다. 빈 DB에는 V1부터 전부 실행된다.
# ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema before Flyway adoption
spring.flyway.validate-on-migrate=true
# 운영 DB에서 되돌리기 어려운 사고를 막는다. 지운 마이그레이션을 조용히 넘기지 않고 실패시킨다.
spring.flyway.clean-disabled=true
spring.flyway.ignore-migration-patterns=

# ==============================
# File Upload Limits
# ==============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==============================
# Session
# ==============================
server.servlet.session.timeout=1800

# ==============================
# AWS Region (bucket and credentials are profile-specific)
# ==============================
cloud.aws.region.static=ap-northeast-2

# ==============================
# OAuth2 Google fixed settings (client-id/secret are profile-specific)
# Kakao/Naver: add the full registration.* block in each profile file
# once credentials are available (Spring Boot requires non-empty client-id
# whenever any registration.* key exists for that provider)
# ==============================
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/login/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=email,profile

# ==============================
# OAuth2 Provider Endpoints (fixed external URLs, not profile-specific)
# ==============================
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# ==============================
# Execution Logging
# ==============================
app.execution-logging.slow-threshold-ms=300
