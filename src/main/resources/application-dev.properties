# ==============================================================================
# dev profile: deployed development server.
# Loaded on top of application.properties. Run with:
#   ./gradlew bootRun --args='--spring.profiles.active=dev'
# Pass credentials through environment variables. The defaults after ':' are
# for local runs only; the deployed server must override them.
# ==============================================================================


# ==============================
# Actuator
# ==============================

# dev is deployed too, so Actuator moves to a separate management port like
# prod. Using prod's port layout avoids deploy errors caused by environment
# differences.
management.server.port=8081

# Endpoints exposed over HTTP on the management port.
management.endpoints.web.exposure.include=health,metrics,prometheus

# Shows every health component detail. Assumes 8081 is not routed to the
# outside.
management.endpoint.health.show-details=always


# ==============================
# Datasource and JPA
# ==============================

# JDBC URL. Defaults to a local MySQL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/highteenday_db}

# Database user. Defaults to root.
spring.datasource.username=${DB_USERNAME:root}

# Database password. The default is for local runs only.
spring.datasource.password=${DB_PASSWORD:}

# Hibernate never touches the schema; Flyway owns it (docs/MIGRATION.md).
# The dev database still has column types left from the former
# ddl-auto=update that differ from prod (e.g. enum vs VARCHAR).
spring.jpa.hibernate.ddl-auto=none

# Never runs schema.sql or data.sql.
spring.sql.init.mode=never


# ==============================
# Logging
# ==============================

# Log level of the application packages.
logging.level.com.example.highteenday_backend=INFO

# DEBUG for HotPostService: logs every hot score update and every post
# removed from Redis because it no longer exists in the DB.
logging.level.com.example.highteenday_backend.services.domain.HotPostService=DEBUG

# p6spy SQL logging off to avoid its overhead. The p6spy proxy stays in place
# for the query count metrics.
decorator.datasource.p6spy.enable-logging=false

# Level of the p6spy logger that SQL lines go to.
logging.level.p6spy=warn


# ==============================
# Redis
# ==============================

# Redis host. Defaults to localhost.
spring.data.redis.host=${REDIS_HOST:localhost}

# Redis port. Defaults to 6379.
spring.data.redis.port=${REDIS_PORT:6379}


# ==============================
# CORS
# ==============================

# Not read by the code. SecurityConfig.ALLOWED_ORIGINS fixes the allowed
# origins, so CORS_ORIGINS has no effect.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}


# ==============================
# AWS S3
# Outside prod, S3Config reads credentials from the AWS profile file
# (~/.aws/credentials).
# ==============================

# S3 bucket for uploaded files.
cloud.aws.s3.bucket=${S3_BUCKET:highteenday-bucket-0906}


# ==============================
# OAuth2 Login (Google)
# ==============================

# Google OAuth client ID.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}

# Google OAuth client secret.
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}


# ==============================
# External APIs
# ==============================

# NEIS open API key (school info, meals, and schedules).
neis.api.key=${NEIS_API_KEY:dummy-neis-key}


# ==============================
# JWT
# ==============================

# HMAC key that signs access and refresh tokens. HS512 needs at least
# 64 bytes. The default is for local runs only; the deployed dev server must
# set JWT_KEY.
jwt.key=${JWT_KEY:local-dev-jwt-signing-key-must-be-at-least-64-bytes-long-0123456789abcdef}


# ==============================
# Query Count Metrics
# dev is deployed but gets almost no traffic, so queries are broken down per
# SQL. One log line then shows which SQL a heavy request repeated and how
# often, which confirms an N+1 without load.
# ==============================

# Per-SQL execution counts in metrics and logs.
app.query-metrics.detail-enabled=true

# Logs one WARN line for a request that runs 20 or more queries.
app.query-metrics.warn-threshold=20
