# ==============================
# Development Server Environment
# Inject sensitive values via environment variables: -Dkey=value or server env settings
# ==============================

# ==============================
# Actuator
# 운영과 같은 이유로 관리 포트를 분리한다 — dev도 배포된 서버이고,
# GET /** permitAll 은 프로파일과 무관한 SecurityConfig 설정이라 노출 위험이 동일하다.
# (환경 간 구성을 맞춰두면 "dev에선 됐는데 운영에서 안 된다"를 막을 수 있다.)
# ==============================
management.server.port=8081
management.endpoints.web.exposure.include=health,metrics,prometheus
# 상세 표시는 관리 포트를 분리했기 때문에 켤 수 있다 — 8081은 외부로 라우팅되지 않는다.
# (분리 전이라면 GET /** permitAll 탓에 DB/Redis 구성 정보가 그대로 공개됐다.)
management.endpoint.health.show-details=always

# DB
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/highteenday_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA
# Flyway가 스키마를 소유하므로 Hibernate는 스키마를 건드리지 않는다.
# 예전에는 update였고, 그래서 dev DB의 일부 컬럼 타입이 운영과 다르게 만들어져 있다
# (예: enum vs VARCHAR). 드리프트를 정리한 뒤에는 validate로 올려 부팅 시점에
# 스키마 불일치를 잡는 것이 목표다. 자세한 내용은 docs/MIGRATION.md 참고.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# ==============================
# Logging (moderate)
# ==============================
logging.level.com.example.highteenday_backend=INFO
logging.level.com.example.highteenday_backend.services.domain.HotPostService=DEBUG

# p6spy disabled (performance overhead)
decorator.datasource.p6spy.enable-logging=false
logging.level.p6spy=warn

# ==============================
# Redis
# ==============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ==============================
# CORS
# ==============================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ==============================
# AWS S3
# Credentials are resolved via DefaultAWSCredentialsProviderChain (env vars or instance profile)
# ==============================
cloud.aws.s3.bucket=${S3_BUCKET:highteenday-bucket-0906}

# ==============================
# OAuth2 Credentials
# ==============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret}

# Uncomment below and fill in credentials when Kakao/Naver apps are registered
# spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
# spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
# spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
# spring.security.oauth2.client.registration.kakao.client-authentication-method=POST
# spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email

# spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
# spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
# spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
# spring.security.oauth2.client.registration.naver.client-authentication-method=POST
# spring.security.oauth2.client.registration.naver.scope=name,email

# ==============================
# School API (NEIS)
# ==============================
neis.api.key=${NEIS_API_KEY:dummy-neis-key}

# ==============================
# JWT
# 기본값은 로컬 개발 전용이다. 배포되는 dev 서버에서는 반드시 JWT_KEY 로 덮어쓴다.
# ==============================
jwt.key=${JWT_KEY:local-dev-jwt-signing-key-must-be-at-least-64-bytes-long-0123456789abcdef}

# ==============================
# Query Count Metrics
# dev 는 배포됐지만 트래픽이 거의 없는 서버라, 요청당 쿼리를 SQL 단위까지 펼쳐 둔다.
# 무거운 요청 한 건이 어떤 SQL 을 몇 번 반복했는지가 로그 한 줄에 남는다 —
# N+1 을 부하 없이 확정할 때 쓰는 근거다.
# ==============================
app.query-metrics.detail-enabled=true
app.query-metrics.warn-threshold=20
