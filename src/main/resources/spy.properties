# ==============================================================================
# P6Spy SQL logging settings.
# Used only when a profile sets decorator.datasource.p6spy.enable-logging=true.
# The query count metrics use the p6spy proxy either way.
# ==============================================================================

# Sends SQL lines to SLF4J under the p6spy logger, so logging.level.p6spy
# controls them.
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# Writes each statement on a single line.
logMessageFormat=com.p6spy.engine.spy.appender.SingleLineFormat

# excludecategories is left unset so every statement is logged, including
# list SELECTs and N+1 queries, not only count queries.
