# ==============================
# Performance Testing Environment
# Run: java -jar app.jar --spring.profiles.active=prod,perf
#
# "prod" 프로파일 위에 이 프로파일을 겹쳐 쓴다(profiles.active 목록의 뒤쪽이 우선 적용).
# prod의 나머지 설정(ddl-auto=none, 환경변수 기반 DB/Redis/OAuth2/JWT, AppStartupRunner
# 비활성화 등)은 그대로 유지하면서, 쿠키 도메인/보안 설정만 로컬/사설망 테스트에 맞게
# 되돌린다.
#
# 이유: app.cookie-domain=.highteenday.org + app.cookie-secure=true(HTTPS 전용) 상태로는
# localhost/사설 IP + 평문 HTTP로 붙는 부하 테스트에서 브라우저·k6·모든 표준 준수
# 쿠키 저장소가 Set-Cookie를 절대 재전송하지 않는다(RFC 6265 도메인/Secure 매칭 실패) —
# 로그인은 200이 나와도 그 다음 인증이 필요한 모든 요청이 401로 실패한다(실측 확인됨).
# ==============================
app.cookie-domain=
app.cookie-secure=false
app.cookie-same-site=Lax
