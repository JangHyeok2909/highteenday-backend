# ==============================
# Performance Testing Environment
# Run: java -jar app.jar --spring.profiles.active=prod,perf
#
# "prod" 프로파일 위에 이 프로파일을 겹쳐 쓴다(profiles.active 목록의 뒤쪽이 우선 적용).
# prod의 나머지 설정(ddl-auto=none, 환경변수 기반 DB/Redis/OAuth2/JWT, AppStartupRunner
# 비활성화 등)은 그대로 유지하면서, 쿠키 도메인/보안 설정만 로컬/사설망 테스트에 맞게
# 되돌린다.
#
# 이유: app.cookie-domain=.highteenday.org + app.cookie-secure=true(HTTPS 전용) 상태로는
# localhost/사설 IP + 평문 HTTP로 붙는 부하 테스트에서 브라우저·k6·모든 표준 준수
# 쿠키 저장소가 Set-Cookie를 절대 재전송하지 않는다(RFC 6265 도메인/Secure 매칭 실패) —
# 로그인은 200이 나와도 그 다음 인증이 필요한 모든 요청이 401로 실패한다(실측 확인됨).
# ==============================
app.cookie-domain=
app.cookie-secure=false
app.cookie-same-site=Lax

# prod는 GET /** permitAll + 공개 ALB 때문에 health 상세를 when-authorized로 가리지만,
# perf 스택은 도커 내부 네트워크에 격리돼 있고 호스트로는 18080만 열린다. 실험 중
# 어떤 컴포넌트(DB/Redis/디스크)가 DOWN인지 즉시 봐야 하므로 상세를 전부 켠다.
management.endpoint.health.show-details=always

# ==============================
# 관리 포트를 메인 포트(8080)로 되돌린다.
#
# prod가 액추에이터를 8081로 분리하는데(공개 ALB로 지표가 새는 것을 막기 위함),
# perf 스택은 그 위에 얹혀 돌기 때문에 그대로 두면 8081을 상속받는다. 그러면
#   - prometheus.yml 의 스크레이프 타겟 app:8080/actuator/prometheus 가 죽고
#   - docker-compose.perf.yml 이 8080만 매핑하므로 localhost:18080/actuator/health 도 죽는다.
# 즉 대시보드 전체가 조용히 빈 채로 실험이 진행된다.
#
# perf 스택은 도커 내부 네트워크에 격리돼 있고 외부로 나가는 경로가 없으므로
# 메인 포트에 함께 두어도 안전하다. 빈 값 = "설정하지 않음" = 메인 포트 사용.
# ==============================
management.server.port=

# ==============================
# Query Count Metrics — 측정 중에는 지표만 남긴다
#
# detail 과 WARN 로그를 끈다. 지금 확인된 요청당 쿼리 수(수백 개)라면 사실상 모든
# 요청이 임계를 넘어 로그가 쏟아지고, 그 로그 I/O 가 측정 대상인 지연에 그대로
# 섞인다. 측정 환경에서 계측이 측정값을 바꾸면 안 된다.
#
# SQL 단위 증거가 필요하면 부하 없이 dev 에서 재현하는 것이 순서다
# (BTL-005 "개선 전 선행 조건 ①": 부하 테스트보다 코드 레벨 확정이 먼저다).
#
# 관리 포트를 메인 포트로 되돌리는 프로파일이라 Prometheus 스크레이프가 이 필터를
# 통과한다. /actuator 는 필터 기본 제외 목록에 있으므로 시계열이 늘지 않는다.
# ==============================
app.query-metrics.detail-enabled=false
app.query-metrics.warn-threshold=-1
