# ==============================================================================
# perf profile: load and resilience tests.
# Stacks on top of prod, and the later profile wins:
#   java -jar app.jar --spring.profiles.active=prod,perf
# (performance/environment/docker-compose.perf.yml passes this list.)
# Every other prod setting stays: ddl-auto=none, DB, Redis, OAuth2, and JWT
# from environment variables, and AppStartupRunner off. This profile reverts
# only what breaks a plain-HTTP test stack.
# ==============================================================================


# ==============================
# Auth Cookies
# With prod's cookie-domain=.highteenday.org and Secure=true, clients that
# reach the app via localhost or a private IP over plain HTTP never send the
# cookies back (RFC 6265 domain and Secure matching). Login returns 200 and
# every authenticated request after it fails with 401.
# ==============================

# Empty: host-only cookies for whatever host the client used.
app.cookie-domain=

# Allows the auth cookies over plain HTTP.
app.cookie-secure=false

# Lax, because SameSite=None requires Secure=true.
app.cookie-same-site=Lax


# ==============================
# Actuator
# ==============================

# Shows every health component detail. The perf stack is isolated on a Docker
# network with only port 18080 open to the host, and experiments need to see
# at once which component (DB, Redis, disk) is DOWN.
management.endpoint.health.show-details=always

# Empty: no separate management port, so Actuator returns to the main port
# 8080. Inheriting prod's 8081 would break the Prometheus target
# app:8080/actuator/prometheus and localhost:18080/actuator/health
# (docker-compose.perf.yml maps only 8080), and experiments would run with
# empty dashboards. The perf stack has no route to the outside, so sharing
# the main port is safe.
management.server.port=


# ==============================
# Query Count Metrics
# Metrics only while measuring. When requests run many queries, most of them
# would cross the WARN threshold, and that log I/O would mix into the latency
# being measured. For SQL-level evidence, reproduce the request on dev without
# load. Prometheus scrapes pass through the query count filter on this
# profile, but /actuator is on its ignore list, so no series are added.
# ==============================

# Per-SQL breakdown off.
app.query-metrics.detail-enabled=false

# -1 disables the WARN log for query-heavy requests.
app.query-metrics.warn-threshold=-1
