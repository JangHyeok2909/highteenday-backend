# ==============================
# Production Environment
# All sensitive values must be injected via environment variables (no hardcoding)
# Run: java -jar app.jar --spring.profiles.active=prod
# ==============================

# ==============================
# Actuator
# ==============================
# show-details=when-authorized: /actuator/health is publicly accessible (GET /** is permitAll),
# but component details (DB, Redis, disk) are only shown to authenticated users.
management.endpoint.health.show-details=when-authorized

# 관리 엔드포인트를 별도 포트로 분리한다.
#
# 이유: SecurityConfig의 `.requestMatchers(HttpMethod.GET, "/**").permitAll()` 때문에
# 액추에이터 엔드포인트는 전부 무인증 GET으로 열린다. ALB는 api.highteenday.org/* 를
# 8080으로 그대로 포워딩하므로, 이 포트에 prometheus/metrics를 노출하면
# https://api.highteenday.org/actuator/prometheus 가 인터넷에 공개된다
# (URI 인벤토리·요청량·에러율·JVM/DB 커넥션 풀 상태가 전부 새어 나간다).
#
# 8081은 ALB 타겟 그룹에 등록되어 있지 않아 외부에서 도달할 수 없고,
# 같은 호스트/VPC의 Prometheus만 스크레이프할 수 있다.
#
# ⚠ 배포 전 반드시 확인 (prod 프로파일 단독 기동으로 실측한 결과):
#
#     8080 /actuator/prometheus -> 404      8081 /actuator/prometheus -> 200
#     8080 /actuator/health     -> 404      8081 /actuator/health     -> 200
#
#   1. **/actuator/health 도 8081로 함께 옮겨져 8080에서는 404가 된다.**
#      ALB 타겟 그룹 헬스체크가 8080의 /actuator/health 를 보고 있다면 전 타겟이
#      unhealthy로 떨어져 장애가 난다. 배포 전에 헬스체크의 "포트" 설정을
#      traffic-port 대신 8081로 오버라이드할 것(ALB가 지원한다).
#   2. docker-compose.prod.yml 이 network_mode: host 라 8081이 EC2 호스트에 그대로
#      바인딩된다. 보안 그룹에서 8081이 0.0.0.0/0 으로 열려 있지 않아야 한다.
#      (Prometheus가 같은 호스트에서만 돈다면 management.server.address=127.0.0.1 로
#       한 겹 더 막을 수 있다. VPC 내 별도 호스트에서 스크레이프한다면 설정하지 말 것.)
management.server.port=8081
management.endpoints.web.exposure.include=health,metrics,prometheus


# DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA (validate — block DDL changes; startup fails fast on schema mismatch)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# ==============================
# Logging (minimal)
# ==============================
logging.level.com.example.highteenday_backend=INFO
logging.level.root=INFO

# p6spy fully disabled
decorator.datasource.p6spy.enable-logging=false
logging.level.p6spy=off

# ==============================
# Redis
# ==============================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# ==============================
# CORS (production domain only)
# ==============================
app.cors.allowed-origins=https://highteenday.org,https://www.highteenday.org

# ==============================
# AWS S3
# Credentials are resolved automatically via EC2 Instance Profile (ec2-s3-role)
# No access key / secret key needed
# ==============================
cloud.aws.s3.bucket=${S3_BUCKET}

# ==============================
# OAuth2 Credentials
# ==============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

