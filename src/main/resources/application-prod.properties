# ==============================================================================
# prod profile: production server.
# Loaded on top of application.properties. Run with:
#   java -jar app.jar --spring.profiles.active=prod
# Every credential comes from an environment variable. Never write a secret
# value in this file.
# ==============================================================================


# ==============================
# Actuator
# ==============================

# Health component details (db, redis, diskSpace, ...) are shown only to
# authorized requests.
management.endpoint.health.show-details=when-authorized

# Serves Actuator on a separate management port. SecurityConfig permits
# /actuator/** for the perf profile, so on 8080 the ALB would forward
# prometheus and metrics to the internet and expose the URI inventory,
# traffic, error rates, and JVM and connection pool state. 8081 is not in the
# ALB target group, so only Prometheus on the same host or VPC reaches it.
#
# Check before deploying (measured by starting the prod profile alone):
#   8080 /actuator/health     -> 404    8081 /actuator/health     -> 200
#   8080 /actuator/prometheus -> 404    8081 /actuator/prometheus -> 200
#
# 1. The ALB target group health check must use port 8081 (override
#    traffic-port) and path /actuator/health/readiness. The aggregate
#    /actuator/health returns 503 when Redis is down even while fallbacks keep
#    responses healthy, so every target would leave at once (see the readiness
#    group in application.properties). This file cannot change the check:
#    both the port and the path must be set on the target group in the AWS
#    console.
# 2. docker-compose.prod.yml uses network_mode: host, so 8081 binds directly
#    on the EC2 host. The security group must not open 8081 to 0.0.0.0/0.
#    If Prometheus runs only on the same host,
#    management.server.address=127.0.0.1 adds one more layer. Do not set it
#    when Prometheus scrapes from another host in the VPC.
management.server.port=8081

# Endpoints exposed over HTTP on the management port.
management.endpoints.web.exposure.include=health,metrics,prometheus


# ==============================
# Datasource and JPA
# ==============================

# JDBC URL of the production MySQL.
spring.datasource.url=${DB_URL}

# Database user.
spring.datasource.username=${DB_USERNAME}

# Database password.
spring.datasource.password=${DB_PASSWORD}

# Hibernate never touches the schema; Flyway owns it (docs/MIGRATION.md).
# none also skips schema validation, so an entity/schema mismatch surfaces as
# a runtime SQL error, not as a startup failure.
spring.jpa.hibernate.ddl-auto=none

# Never runs schema.sql or data.sql.
spring.sql.init.mode=never


# ==============================
# Logging
# ==============================

# Log level of the application packages.
logging.level.com.example.highteenday_backend=INFO

# Log level of every other logger.
logging.level.root=INFO

# p6spy SQL logging off. The p6spy proxy stays in place for the query count
# metrics.
decorator.datasource.p6spy.enable-logging=false

# Silences the p6spy logger.
logging.level.p6spy=off


# ==============================
# Redis
# ==============================

# Redis host.
spring.data.redis.host=${REDIS_HOST}

# Redis port. Defaults to 6379.
spring.data.redis.port=${REDIS_PORT:6379}


# ==============================
# CORS
# ==============================

# Not read by the code. SecurityConfig.ALLOWED_ORIGINS fixes the allowed
# origins.
app.cors.allowed-origins=https://highteenday.org,https://www.highteenday.org


# ==============================
# AWS S3
# S3Config uses the EC2 instance profile (ec2-s3-role) for credentials on
# prod, so no access key is configured.
# ==============================

# S3 bucket for uploaded files.
cloud.aws.s3.bucket=${S3_BUCKET}


# ==============================
# OAuth2 Login (Google)
# ==============================

# Google OAuth client ID.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

# Google OAuth client secret.
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Fixed HTTPS callback URL. Replaces the {baseUrl} template in
# application.properties.
spring.security.oauth2.client.registration.google.redirect-uri=https://api.highteenday.org/oauth2/login/code/google


# ==============================
# External APIs
# ==============================

# NEIS open API key (school info, meals, and schedules).
neis.api.key=${NEIS_API_KEY}


# ==============================
# JWT
# ==============================

# HMAC key that signs access and refresh tokens. HS512 needs at least
# 64 bytes.
jwt.key=${JWT_KEY}


# ==============================
# Public URLs and Auth Cookies
# ==============================

# Server URL listed in the OpenAPI document, so Swagger UI calls the API over
# HTTPS.
app.server-url=https://api.highteenday.org

# Frontend origin for the redirect after OAuth2 login.
app.frontend-url=https://www.highteenday.org

# Domain attribute of the auth cookies. The leading dot shares them across
# highteenday.org subdomains (api and www).
app.cookie-domain=.highteenday.org

# Sends the auth cookies over HTTPS only.
app.cookie-secure=true

# SameSite=Lax. www and api share the site highteenday.org, so the frontend's
# calls to the API are same-site and carry the cookies. From another site the
# browser sends the cookies only on top-level GET navigations, not on fetch,
# iframe or form POST requests. The OAuth2 callback does not depend on these
# cookies: it issues them, and the authorization request lives in the servlet
# session cookie, whose SameSite is a server.servlet setting. A
# frontend served from another site, such as localhost:3000, cannot
# authenticate against this API under Lax; it needs None together with
# app.cookie-secure=true.
app.cookie-same-site=Lax
