# ==============================
# Production Environment
# All sensitive values must be injected via environment variables (no hardcoding)
# Run: java -jar app.jar --spring.profiles.active=prod
# ==============================

# ==============================
# Actuator
# ==============================
# 인증된 관리 요청에만 DB, Redis, 디스크 등 컴포넌트 상세 정보를 공개한다.
management.endpoint.health.show-details=when-authorized

# 관리 엔드포인트를 애플리케이션 트래픽과 분리하기 위해 별도 포트로 둔다.
#
# SecurityConfig는 perf 프로파일의 수집 경로를 위해 `/actuator/**`를 허용한다. prod에서
# Actuator를 8080에 함께 두면 ALB가 prometheus/metrics까지 외부로 전달하므로, URI
# 인벤토리·요청량·에러율·JVM/DB 커넥션 풀 상태가 공개될 수 있다.
#
# 8081은 ALB 타겟 그룹에 등록되어 있지 않아 외부에서 도달할 수 없고,
# 같은 호스트/VPC의 Prometheus만 스크레이프할 수 있다.
#
# ⚠ 배포 전 반드시 확인 (prod 프로파일 단독 기동으로 실측한 결과):
#
#     8080 /actuator/prometheus -> 404      8081 /actuator/prometheus -> 200
#     8080 /actuator/health     -> 404      8081 /actuator/health     -> 200
#
#   1. **/actuator/health 도 8081로 함께 옮겨져 8080에서는 404가 된다.**
#      ALB 타겟 그룹 헬스체크가 8080의 /actuator/health 를 보고 있다면 전 타겟이
#      unhealthy로 떨어져 장애가 난다. 배포 전에 헬스체크의 "포트" 설정을
#      traffic-port 대신 8081로 오버라이드할 것(ALB가 지원한다).
#   2. docker-compose.prod.yml 이 network_mode: host 라 8081이 EC2 호스트에 그대로
#      바인딩된다. 보안 그룹에서 8081이 0.0.0.0/0 으로 열려 있지 않아야 한다.
#      (Prometheus가 같은 호스트에서만 돈다면 management.server.address=127.0.0.1 로
#       한 겹 더 막을 수 있다. VPC 내 별도 호스트에서 스크레이프한다면 설정하지 말 것.)
management.server.port=8081
management.endpoints.web.exposure.include=health,metrics,prometheus


# DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA — schema is owned by Flyway (docs/MIGRATION.md), so Hibernate must not touch it.
# Note: `none` skips schema validation entirely; a code/schema mismatch surfaces as a
# runtime SQL error, not a startup failure. Switching to `validate` is a pending decision.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# ==============================
# Logging (minimal)
# ==============================
logging.level.com.example.highteenday_backend=INFO
logging.level.root=INFO

# p6spy fully disabled
decorator.datasource.p6spy.enable-logging=false
logging.level.p6spy=off

# ==============================
# Redis
# ==============================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# ==============================
# CORS (production domain only)
# ==============================
app.cors.allowed-origins=https://highteenday.org,https://www.highteenday.org

# ==============================
# AWS S3
# Credentials are resolved automatically via EC2 Instance Profile (ec2-s3-role)
# No access key / secret key needed
# ==============================
cloud.aws.s3.bucket=${S3_BUCKET}

# ==============================
# OAuth2 Credentials
# ==============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# ==============================
# School API (NEIS)
# ==============================
neis.api.key=${NEIS_API_KEY}

# ==============================
# JWT
# ==============================
jwt.key=${JWT_KEY}

# ==============================
# Swagger server URL (force HTTPS)
# ==============================
app.server-url=https://api.highteenday.org
spring.security.oauth2.client.registration.google.redirect-uri=https://api.highteenday.org/oauth2/login/code/google
app.frontend-url=https://www.highteenday.org
app.cookie-domain=.highteenday.org
app.cookie-secure=true
app.cookie-same-site=None
